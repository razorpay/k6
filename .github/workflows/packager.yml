name: k6packager
on:
  # Enable manually triggering this workflow via the API or web UI
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly (Sundays at 00:00)

defaults:
  run:
    shell: bash

jobs:
  publish-packager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: 0.0.3
      AWSCLI_VERSION: 2.1.36
      S3CMD_VERSION: 2.1.0
      DOCKER_IMAGE_ID: ghcr.io/grafana/k6packager
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Start PMG proxy
        uses: safedep/pmg@5ac0f275b83d9d5a9342c6aae977ec32fa330daa # v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Build
        run: |
          cd packaging
          docker-compose build packager
      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login https://ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "${DOCKER_IMAGE_ID}:latest"
          docker tag "${DOCKER_IMAGE_ID}" "${DOCKER_IMAGE_ID}:${VERSION}"
          docker push "${DOCKER_IMAGE_ID}:${VERSION}"
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
