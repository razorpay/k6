name: TC39
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
      paths:
          - 'js/**'

defaults:
  run:
    shell: bash

jobs:
  tc39:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Start PMG proxy
        uses: safedep/pmg@5ac0f275b83d9d5a9342c6aae977ec32fa330daa # v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.16.x
      - name: Run tests
        run: |
          set -x
          cd js/tc39
          sh checkout.sh
          go test -timeout 1h
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
