name: ARM tests
on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.x
      - name: Run tests
        run: |
          set -x
          go version
          go env
          export GOMAXPROCS=2
          export CGO_ENABLED=1
          go test -p 2 -race -timeout 800s -count 1 ./...
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
