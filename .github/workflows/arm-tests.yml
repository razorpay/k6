name: ARM tests
on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Start PMG proxy
        uses: safedep/pmg@5ac0f275b83d9d5a9342c6aae977ec32fa330daa # v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.x
      - name: Run tests
        run: |
          set -x
          go version
          go env
          export GOMAXPROCS=2
          export CGO_ENABLED=1
          go test -p 2 -race -timeout 800s -count 1 ./...
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
